version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jira_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jira_saas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  jira-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jira_saas_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/jira_saas?schema=public
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
